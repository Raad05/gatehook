[package]
name = "gatehook"
version = "0.1.0"
description = "Token-2022 transfer-hook compliance engine for RWA tokens"
license = "MIT"
authors = ["Yamin Raad"]
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "gatehook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", default-features = false, features = ["solana-v3", "token", "token_2022", "token_2022_extensions"] }
spl-transfer-hook-interface = "2.1"
spl-tlv-account-resolution = "0.11"
spl-discriminator = "0.5"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
anchor-spl = { version = "1.2.0", default-features = false, features = ["solana-v3", "token", "token_2022", "token_2022_extensions"] }
spl-transfer-hook-interface = "2.1"
spl-tlv-account-resolution = "0.11"
spl-discriminator = "0.5"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

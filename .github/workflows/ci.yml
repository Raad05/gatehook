name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "3.1.14"
  ANCHOR_VERSION: "1.2.0"
  CARGO_TERM_COLOR: always

jobs:
  program:
    name: Program (build, lint, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins 1.89.0 + rustfmt/clippy; rustup installs it on first use.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache Solana + Anchor CLIs
        id: cli-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/anchor
          key: cli-${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      - name: Install Solana CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Install Anchor CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install anchor-cli --version "${ANCHOR_VERSION}" --locked

      - name: Add CLIs to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --check

      # SBPF v1: v3 (Anchor 1.2 default) is not active on devnet/mainnet.
      - name: Build program + IDL
        run: anchor build --arch v1

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Upload program artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: program
          path: |
            target/deploy/gatehook.so
            target/idl/gatehook.json
          if-no-files-found: error
          retention-days: 7

  typescript:
    name: SDK, scripts, oracle
    needs: program
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Download program artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: program
          path: target

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated SDK is up to date
        run: |
          pnpm generate
          git diff --exit-code -- sdk/src/generated || {
            echo "::error::sdk/src/generated is stale. Run 'anchor run build && pnpm generate' and commit."
            exit 1
          }

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
